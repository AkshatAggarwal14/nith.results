name: Recompute Ranks

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Batch number to rank (e.g. 20, 21 - leave empty to rank all batches)"
        required: false
        default: ""

jobs:
  rank:
    name: Rank Results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "latest"

      - name: Install Dependencies
        run: yarn install

      - name: Recompute Ranks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -n "${{ github.event.inputs.batch }}" ]; then
            node scripts/rank.mjs "${{ github.event.inputs.batch }}"
          else
            yarn rank
          fi
